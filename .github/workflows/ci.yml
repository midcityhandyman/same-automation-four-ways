name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      # Node.js is only used by one test, which runs the n8n Code node
      # against the Python normalizer. Without Node that test is skipped.
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - name: Demo runs offline and matches the saved output
        run: python demo/run_demo.py | diff - demo/output.txt
